<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Screenbook</title>
  <meta name="theme-color" content="#262626">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="top">
      <h1><img src="icon.svg" alt="" class="logo">Screenbook</h1>
      <div class="actions">
        <button id="settingsBtn" class="ghost small">Ajustes</button>
        <button id="backup" class="ghost small" title="Descarga todo tu historial en un archivo">Copia</button>
      </div>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Buscar serie o película…" autocomplete="off">
      <div id="results" class="results" hidden></div>
    </div>
    <nav class="tabs">
      <button data-tab="watching" class="on">Viendo <span class="count"></span></button>
      <button data-tab="pending">Pendiente <span class="count"></span></button>
      <button data-tab="seen">Visto <span class="count"></span></button>
      <button data-tab="paused">En pausa <span class="count"></span></button>
      <button data-tab="news">Novedades</button>
      <button data-tab="lists">Listas <span class="count"></span></button>
      <button data-tab="discover">Descubrir</button>
    </nav>
    <div class="filters">
      <button data-type="all" class="on">Todo</button>
      <button data-type="tv">Series</button>
      <button data-type="movie">Películas</button>
      <select id="platformFilter" aria-label="Filtrar por plataforma"></select>
    </div>
  </header>
  <p id="notice" class="notice" hidden>Falta configurar la clave de TMDB: la búsqueda no funcionará todavía.</p>
  <main id="main"></main>
  <dialog id="detail"></dialog>
  <dialog id="settings"></dialog>
  <footer>Datos de títulos y plataformas: TMDB. Este producto usa la API de TMDB pero no está avalado ni certificado por TMDB.</footer>
  <script type="module" src="app.js"></script>
</body>
</html>
